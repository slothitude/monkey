[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.1.0"
description = "A unified LLM router supporting multiple providers with OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "LLM Router Team" }
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
llm-router = "llm_router.server.api:run_server"
